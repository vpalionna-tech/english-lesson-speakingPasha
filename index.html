<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Read and Speak: 50-Minute Lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F7F4; --surface:#FFFFFF; --ink:#142B25; --line:#142B25; --soft:#D3E6DD; --muted:#4B6A60;
  --acc:#1F6F5C; --onacc:#FFFFFF; --amber:#F2A33A; --good:#D5F0E1; --bad:#FFDCD2; --focus:#0A5CFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1D19; --surface:#15302A; --ink:#EAF7F2; --line:#6FB09D; --soft:#25463D; --muted:#A9CDBF; --acc:#5CD1B0; --onacc:#0E1D19; --good:#1E5A44; --bad:#6B2A25; --focus:#9CC1FF; }
}
:root[data-theme="dark"]{ --bg:#0E1D19; --surface:#15302A; --ink:#EAF7F2; --line:#6FB09D; --soft:#25463D; --muted:#A9CDBF; --acc:#5CD1B0; --onacc:#0E1D19; --good:#1E5A44; --bad:#6B2A25; --focus:#9CC1FF; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:18px;line-height:1.5}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.ipa{font-family:'Noto Sans','Segoe UI','DejaVu Sans',system-ui,sans-serif}

.head{background:var(--acc);color:var(--onacc);padding:16px 14px 14px;border-bottom:3px solid var(--line)}
.head-in{max-width:880px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.head h1{margin:0;font-size:clamp(26px,5.5vw,38px);font-weight:800;line-height:1.05}
.head p{margin:4px 0 0;font-size:16px;opacity:.95}
.pill{background:var(--amber);color:#142B25;border:2px solid #142B25;border-radius:10px;padding:2px 12px;font-weight:800;font-size:17px;white-space:nowrap}
.wrap{max-width:880px;margin:0 auto;padding:14px 14px 40px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 14px;border-bottom:3px solid var(--line)}
.tab{cursor:pointer;background:none;border:0;border-bottom:6px solid transparent;margin-bottom:-3px;padding:6px 2px 4px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;line-height:1.1;color:var(--muted)}
.tab .ic{font-size:24px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}

.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:18px 14px}
h2{font-size:25px;margin:0 0 4px;font-weight:800}
h3{font-size:17px;margin:16px 0 6px}
.hint{color:var(--muted);font-size:15px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{cursor:pointer;font-weight:600;font-size:15px;border:2px solid var(--line);border-radius:999px;padding:2px 13px;background:var(--surface);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{cursor:pointer;font-weight:700;font-size:17px;border:2px solid var(--line);border-radius:10px;padding:8px 18px;background:var(--surface);color:var(--ink)}
.btn.main{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.amber{background:var(--amber);color:#142B25;border-color:#142B25}
.btn.ok{background:var(--good)}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.bar{height:10px;border:2px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden;margin:0 0 12px}
.bar>i{display:block;height:100%;background:var(--acc)}

.rule{margin:10px 0;padding:8px 12px;border-left:6px solid var(--acc);background:var(--bg);border-radius:6px;font-size:16px}
.plan{display:grid;gap:10px;margin:12px 0}
.ps{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.ps .m{font-size:24px;font-weight:800;min-width:58px;text-align:center;line-height:1.05}
.ps .m small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.ps .t{flex:1}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 12px}
.kpi div{border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;background:var(--surface)}
.kpi .big{font-size:32px;font-weight:800;line-height:1}
.kpi small{display:block;color:var(--muted);font-size:13px;font-weight:600}

.text{margin:8px 0 14px}
.ln{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:var(--surface)}
.ln.cur{background:var(--amber);color:#142B25;border-color:#142B25}
.ln.said{background:var(--good)}
.ln .sp{font-weight:800;min-width:28px}
.ln .en{flex:1;font-size:clamp(20px,4.6vw,26px);font-weight:600;line-height:1.35}
.ln .uk{display:block;font-size:16px;color:var(--muted);font-weight:400;margin-top:2px}
.ln.cur .uk{color:#142B25}
.w{cursor:pointer;border-radius:4px;padding:0 1px}
.w:hover{background:var(--soft)}
.ln.cur .w:hover{background:rgba(255,255,255,.5)}
.gloss{position:sticky;bottom:8px;border:3px solid var(--line);border-radius:14px;background:var(--acc);color:var(--onacc);padding:10px 14px;margin:10px 0;font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.gloss .btn{padding:4px 12px;font-size:15px}

.q{font-size:clamp(21px,4.6vw,27px);font-weight:700;line-height:1.3;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{cursor:pointer;text-align:left;font-weight:700;font-size:19px;border:2px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--surface);color:var(--ink)}
.opt.good{background:var(--good)} .opt.bad{background:var(--bad)} .opt[disabled]{cursor:default}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{text-align:center}
.fb{margin:12px 0 0;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--good)}
.fb.no{background:var(--bad)} .fb b{display:block}
.miss{border:2px solid var(--soft);border-radius:10px;padding:8px 12px;margin:0 0 10px}
.miss p{margin:0}
.blank{display:inline-block;min-width:80px;border-bottom:4px solid var(--acc);text-align:center;padding:0 6px}
.blank.f{border-color:var(--line);background:var(--amber);color:#142B25;border-radius:6px}

.bubble{background:var(--amber);color:#142B25;border:3px solid #142B25;border-radius:18px;padding:14px 16px;margin:6px 0 14px;font-weight:700;font-size:clamp(20px,4.5vw,26px);line-height:1.3}
.helpbox{border:2px dashed var(--line);border-radius:12px;padding:8px 12px;margin:0 0 12px}
.phr{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.phr span{border:2px solid var(--line);border-radius:8px;padding:2px 10px;background:var(--surface);font-weight:600;font-size:16px}
.scene{font-size:clamp(46px,13vw,76px);text-align:center;margin:4px 0}
.timerbox{margin:12px 0 6px}
.tnum{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tbar{height:12px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);margin-top:8px}
.tbar>i{display:block;height:100%;background:var(--acc);width:100%}
.tmsg{margin:6px 0 0;color:var(--muted);font-size:15px}
.faces{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.face{cursor:pointer;font-size:36px;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:2px 12px}
.face[aria-pressed="true"]{background:var(--amber);border-width:4px}
.goal{border-left:6px solid var(--amber);padding:4px 12px;margin:10px 0;font-weight:600}

@media (max-width:660px){
  body{font-size:17px}
  .tab{font-size:12px} .tab .ic{font-size:22px}
}
@media (prefers-reduced-motion: reduce){ .btn:active{transform:none} }
</style>
</head>
<body>

  <div class="pill" id="count" aria-label="Tasks done">✅ 0 tasks</div>
</div></header>
<div class="wrap">
  <div class="tabs" role="tablist" id="tabs" aria-label="Sections"></div>

</div>

var $=function(s){ return document.querySelector(s); };
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function pick(a){ return a[rnd(0,a.length-1)]; }
var canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
var playing=false, playTok=0;
function stopSpeech(){ playing=false; playTok++; try{ if(canSpeak) window.speechSynthesis.cancel(); }catch(e){} }
function say(t,rate){ try{ if(!canSpeak) return; window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=rate||0.85; window.speechSynthesis.speak(u);}catch(e){} }
function esc(s){ return s.replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---------- progress ---------- */

try{ var sv=window.localStorage.getItem(KEY); if(sv){ var o=JSON.parse(sv); P.done=o.done||{}; P.checks=o.checks||{}; } }catch(e){}

var sn=0; function done(tag){ sn++; P.done[tag+':'+Date.now()+':'+sn]=1; saveP(); upCount(); }
function upCount(){ $('#count').textContent='✅ '+Object.keys(P.done).length+' tasks'; }

var tid=null, tLeft=0, tTotal=0;

function fmt(n){ var m=Math.floor(n/60), s=n%60; return m+':'+(s<10?'0':'')+s; }
function timerHTML(sec){ return '<div class="timerbox"><div class="tnum" id="tn" role="timer">'+fmt(sec)+'</div><div class="tbar" aria-hidden="true"><i id="tb"></i></div><p class="tmsg" id="tm">Press Start when you are ready. Short answers are fine!</p></div>'; }
function runT(sec,endMsg){ stopT(); tTotal=sec; tLeft=sec; $('#tn').textContent=fmt(tLeft); $('#tb').style.width='100%'; $('#tm').textContent='Go! Speak without stopping.'; tid=setInterval(function(){ tLeft--; $('#tn').textContent=fmt(tLeft); $('#tb').style.width=(tLeft/tTotal*100)+'%'; if(tLeft===Math.floor(tTotal/2)) $('#tm').textContent='Halfway! You are doing well.'; if(tLeft<=0){ stopT(); $('#tm').textContent=endMsg||'Time! Well done.'; } },1000); }
function chips(modes,cur,attr){ return '<div class="chips" role="group" aria-label="Choose">'+modes.map(function(m){ return '<button class="chip" '+attr+'="'+m[0]+'" aria-pressed="'+(String(cur)===String(m[0]))+'">'+m[1]+'</button>'; }).join('')+'</div>'; }
function helpHTML(title,list){ return '<div class="helpbox"><b>'+title+'</b><div class="phr">'+list.map(function(x){ return '<span>'+x+'</span>'; }).join('')+'</div></div>'; }
function bindAttr(attr,fn){ var cs=document.querySelectorAll('['+attr+']'); for(var i=0;i<cs.length;i++) cs[i].onclick=function(){ fn(this.getAttribute(attr)); }; }

 {l:['I watch a movie.','I see a table.','I drink tea.'],a:'room',o:[['🌳','garden'],['🍳','kitchen'],['🛋️','room']]}

var DLG=[
 {t:'At the shop',e:'🛍️',roles:['A','B'],l:[['A','Hello! How are you?'],['B','I am fine, thank you. And you?'],['A','I am tired.'],['B','Do you eat breakfast?'],['A','No, I don\'t.'],['B','Do you like bread?'],['A','Yes, I do.'],['B','Do you like tea?'],['A','Yes, I do. I like tea.']],tip:'Now change the words: bread → coffee, tea → water.'},
 {t:'At the doctor',e:'🧑‍⚕️',roles:['Doctor','Student'],l:[['Doctor','Hello! I am a doctor. Are you tired?'],['Student','Yes, I am.'],['Doctor','Do you sleep?'],['Student','Yes, I do.'],['Doctor','Do you drink water?'],['Student','No, I don\'t. I drink tea.'],['Doctor','Are you hungry?'],['Student','Yes, I am. I like bread.']],tip:'Now be the doctor. Ask new questions: Do you eat dinner? Do you like coffee?'},
 {t:'Bus or train?',e:'🚌',roles:['A','B'],l:[['A','Do you go by bus?'],['B','Yes, I do.'],['A','Do you like the bus?'],['B','No, I don\'t. I like the train.'],['A','Do you go by train?'],['B','Yes, I do. I go by train.'],['A','Do you play football?'],['B','Yes, I do. I play football in the garden.']],tip:'Now answer about YOU: Do you go by bus? Do you like the train?'},
 {t:'At home',e:'🏠',roles:['A','B'],l:[['A','Where are you?'],['B','I am in the kitchen.'],['A','Do you cook?'],['B','Yes, I do. I cook dinner.'],['A','Do you like dinner?'],['B','Yes, I do. I like bread and tea.'],['A','Do you see the garden?'],['B','Yes, I do. I see a tree.']],tip:'Now change the place: I am in the room. I see the window.'}
];
var INTERVIEW=['Do you drink tea?','Do you drink coffee?','Do you eat breakfast?','Do you eat bread?','Do you like the kitchen?','Do you play football?','Do you play the guitar?','Do you watch a movie?','Do you read a book?','Do you cook dinner?','Do you sleep?','Do you go by bus?','Do you go by train?','Do you like music?','Do you like gardens?','Are you tired?','Are you hungry?','Are you happy?','Are you a teacher?','Are you in the room?'];

/* ================= NAV ================= */
var TABS=[['plan','📋','Plan'],['read','📖','Read'],['check','✅','Check'],['speak','🎤','Speak'],['roles','🎭','Roles']];
var tab='plan', md={read:'listen',speak:'qa'}, ti=0;
var START={plan:function(){ renderPlan(); },read:function(){ renderRead(); },check:function(){ startCheck(); },speak:function(){ renderSpeak(); },roles:function(){ renderRoles(); }};
function drawTabs(){ $('#tabs').innerHTML=TABS.map(function(t){ return '<button class="tab" role="tab" data-t="'+t[0]+'" aria-selected="'+(tab===t[0])+'"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>'; }).join(''); }
function setTab(t,m){ tab=t; if(m) md[t]=m; stopT(); stopSpeech(); drawTabs(); START[t](); window.scrollTo(0,0); }
$('#tabs').addEventListener('click',function(e){ var b=e.target.closest('.tab'); if(b) setTab(b.getAttribute('data-t')); });
function textBar(attr){ return chips(TEXTS.map(function(x,i){ return [i,x.e+' '+x.t]; }),ti,attr); }

/* ================= PLAN ================= */
var rf=-1;
function renderPlan(){
  var steps=[[5,'Warm-up: Interview','speak','interview','Ask and answer simple questions: Do you...? Are you...?'],[12,'Read: Anna and Tom','read','listen','Listen, repeat, read. Tap a word for the translation.'],[7,'Check: Anna and Tom','check','','True / false, choose, fill the gap'],[8,'Read: garden, teacher, weekend','read','read','Read silently, then read two sentences aloud'],[8,'Speak: retell and guess the place','speak','retell','Retell a text. Read riddles and say the place.'],[8,'Roles: dialogues','roles','','Read in roles, swap, then change the words'],[2,'Wrap-up','plan','','Rate yourself']];
  var msgs=['It is okay. Reading aloud gets easier every time!','Good job! Keep practicing.','Great work today!','Wow! You read and spoke a lot!'];
  $('#view').innerHTML='<div class="card"><h2>Read and speak</h2><p class="hint">All words and grammar come from your lessons: food, feelings, house words, jobs, transport, a / an / the, to be, I like, he likes, Do you...?</p><div style="height:10px"></div>'+
   '<div class="kpi"><div><span class="big">'+TEXTS.length+'</span><small>texts</small></div><div><span class="big">'+Object.keys(P.done).length+'</span><small>tasks done</small></div><div><span class="big">'+Object.keys(P.checks).length+'</span><small>texts checked</small></div></div>'+
   '<div class="plan">'+steps.map(function(s,i){ return '<div class="ps"><div class="m">'+s[0]+'<small>min</small></div><div class="t"><b>'+(i+1)+'. '+s[1]+'</b><br><span class="hint">'+s[4]+'</span></div>'+(s[2]==='plan'?'':'<button class="btn amber" data-go="'+i+'">Go</button>')+'</div>'; }).join('')+'</div>'+
   '<div class="rule"><b>How to read:</b> 1) Listen first. 2) Repeat each sentence. 3) Read it yourself. 4) Tap words you do not know. 5) Answer the questions.</div>'+
   '<h3>How do you feel after the lesson?</h3><div class="faces" role="group" aria-label="Rate yourself">'+['😟','😐','🙂','😄'].map(function(f,i){ return '<button class="face" data-f="'+i+'" aria-pressed="'+(rf===i)+'">'+f+'</button>'; }).join('')+'</div>'+(rf>-1?'<div class="goal">'+msgs[rf]+'</div>':'')+
   '<div class="row" style="margin-top:12px"><button class="btn" id="rst">Reset my progress</button></div></div>';
  bindAttr('data-go',function(v){ var s=steps[parseInt(v,10)]; if(s[2]==='read'){ ti=s[3]==='listen'?0:2; } setTab(s[2],s[3]||undefined); });
  bindAttr('data-f',function(v){ rf=parseInt(v,10); renderPlan(); });
  var arm=false; $('#rst').onclick=function(){ if(!arm){ arm=true; this.textContent='Click again to confirm'; } else { P={done:{},checks:{}}; saveP(); upCount(); renderPlan(); } };
}

/* ================= READ ================= */
var rs={cur:-1,said:{},gloss:null,show:{}};
function renderRead(){
  var t=TEXTS[ti], dlg=t.kind==='dlg';
  var h='<div class="card"><h2>Read</h2>'+textBar('data-ti')+chips([['listen','🔊 Listen'],['repeat','🗣️ Repeat'],['read','👀 Read & tap']],md.read,'data-rm');
  h+='<div class="text">'+t.l.map(function(x,i){
    var sp=dlg?x[0]:'', en=dlg?x[1]:x[0], uk=dlg?x[2]:x[1], cls='ln'+(rs.cur===i?' cur':'')+(rs.said[ti+':'+i]?' said':'');
    var words=en.split(/(\s+)/).map(function(w){ if(/^\s+$/.test(w)) return w; var k=w.toLowerCase().replace(/[.,!?]/g,''); return '<span class="w" data-w="'+esc(k)+'">'+esc(w)+'</span>'; }).join('');
    return '<div class="'+cls+'" id="ln'+i+'">'+(dlg?'<span class="sp">'+sp+'</span>':'')+'<div class="en">'+words+(rs.show[ti+':'+i]?'<span class="uk">'+uk+'</span>':'')+'</div><div style="display:grid;gap:6px">'+(canSpeak?'<button class="btn" data-hs="'+i+'" aria-label="Listen">🔊</button>':'')+(md.read==='repeat'?'<button class="btn'+(rs.said[ti+':'+i]?' ok':'')+'" data-sd="'+i+'">'+(rs.said[ti+':'+i]?'✓':'I said it')+'</button>':'')+'<button class="btn" data-uk="'+i+'" aria-label="Translation">🇺🇦</button></div></div>';
  }).join('')+'</div>';
  if(rs.gloss) h+='<div class="gloss"><span>'+rs.gloss[0]+' = '+rs.gloss[1]+'</span>'+(canSpeak?'<button class="btn" id="gs">🔊</button>':'')+'</div>';
  h+='<div class="row">'+(md.read==='listen'?(canSpeak?'<button class="btn main" id="pa">▶ Play all (karaoke)</button><button class="btn" id="st">■ Stop</button>':'<span class="hint">Your browser has no voice. Read aloud yourself.</span>'):'')+(md.read==='repeat'?'<button class="btn main" id="fin">✓ I read the whole text</button>':'')+(md.read==='read'?'<button class="btn main" id="fin">✓ I read the whole text</button>':'')+'<button class="btn amber" id="gc">Questions →</button></div><p class="hint" style="margin-top:8px">'+(md.read==='listen'?'Listen to the text. Each sentence turns yellow.':md.read==='repeat'?'Listen to one sentence, say it, tap «I said it».':'Read silently. Tap any word to see the translation.')+'</p></div>';
  $('#view').innerHTML=h;
  bindAttr('data-ti',function(v){ stopSpeech(); ti=parseInt(v,10); rs={cur:-1,said:{},gloss:null,show:{}}; renderRead(); });
  bindAttr('data-rm',function(v){ stopSpeech(); md.read=v; rs.cur=-1; renderRead(); });
  bindAttr('data-hs',function(v){ var x=t.l[parseInt(v,10)]; say(dlg?x[1]:x[0]); });
  bindAttr('data-sd',function(v){ rs.said[ti+':'+v]=true; renderRead(); });
  bindAttr('data-uk',function(v){ var k=ti+':'+v; rs.show[k]=!rs.show[k]; renderRead(); });
  var ws=document.querySelectorAll('.w'); for(var i=0;i<ws.length;i++) ws[i].onclick=function(){ var k=this.getAttribute('data-w'); rs.gloss=[this.textContent.replace(/[.,!?]/g,''),DICT[k]||'—']; renderRead(); };
  if($('#gs')) $('#gs').onclick=function(){ say(rs.gloss[0]); };
  if($('#pa')) $('#pa').onclick=function(){ playAll(0); };
  if($('#st')) $('#st').onclick=function(){ stopSpeech(); rs.cur=-1; renderRead(); };
  if($('#fin')) $('#fin').onclick=function(){ done('read'); stopSpeech(); if(ti<TEXTS.length-1) ti++; rs={cur:-1,said:{},gloss:null,show:{}}; renderRead(); };
  $('#gc').onclick=function(){ stopSpeech(); setTab('check'); };
}
function playAll(i){
  var t=TEXTS[ti], dlg=t.kind==='dlg'; stopSpeech(); playing=true; var my=++playTok;
  (function step(k){
    if(!playing||my!==playTok) return;
    if(k>=t.l.length){ playing=false; rs.cur=-1; markCur(-1); done('listen'); return; }
    rs.cur=k; markCur(k);
    var text=dlg?t.l[k][1]:t.l[k][0], fired=false, u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85;
    var next=function(){ if(fired) return; fired=true; setTimeout(function(){ step(k+1); },350); };
    u.onend=next; u.onerror=next; try{ window.speechSynthesis.speak(u); }catch(e){ next(); }
    setTimeout(next, 2500+text.length*110);
  })(i);
}
function markCur(k){ var ls=document.querySelectorAll('.ln'); for(var i=0;i<ls.length;i++){ ls[i].classList.toggle('cur',i===k); } if(k>-1&&ls[k]&&ls[k].scrollIntoView) ls[k].scrollIntoView({block:'nearest',behavior:'smooth'}); }

/* ================= CHECK ================= */
var ck={};
function startCheck(){
  var t=TEXTS[ti], list=[];
  t.tf.forEach(function(x){ list.push({type:'tf',q:x[0],a:x[1]?0:1,o:['True','False'],right:x[1]?'True':'False',w:x[2]}); });
  t.mc.forEach(function(x){ var idx=shuffle([0,1,2]); list.push({type:'mc',q:x[0],o:idx.map(function(k){return x[1][k];}),a:idx.indexOf(x[2]),right:x[1][x[2]],w:''}); });
  t.gap.forEach(function(x){ var idx=shuffle([0,1,2]); list.push({type:'gap',q:x[0],o:idx.map(function(k){return x[1][k];}),a:idx.indexOf(x[2]),right:x[1][x[2]],w:x[3]}); });
  ck={list:list,i:0,score:0,picked:-1,miss:[]}; renderCheck();
}
function renderCheck(){
  var t=TEXTS[ti], z=ck, h='<div class="card"><h2>Check: '+t.t+'</h2>'+textBar('data-ti')+'<div class="bar" aria-hidden="true"><i style="width:'+Math.round(z.i/z.list.length*100)+'%"></i></div>';
  if(z.i>=z.list.length){
    if(!z.saved){ z.saved=true; if(z.score>=5) P.checks[t.id]=1; saveP(); done('check'); }
    $('#view').innerHTML=h+'<h2>'+z.score+' out of '+z.list.length+'</h2><p>'+(z.score>=5?'Great reading!':'Read the text once more and try again.')+'</p>'+(z.miss.length?'<h3>Review these</h3>'+z.miss.map(function(m){ return '<div class="miss"><p><b>'+m.q+'</b> → '+m.right+'</p>'+(m.w?'<p class="hint">'+m.w+'</p>':'')+'</div>'; }).join(''):'')+'<div class="row"><button class="btn main" id="ag">Try again</button><button class="btn" id="rd">Read the text again</button><button class="btn amber" id="nx">Next text →</button></div></div>';
    bindAttr('data-ti',function(v){ ti=parseInt(v,10); startCheck(); }); $('#ag').onclick=startCheck; $('#rd').onclick=function(){ setTab('read'); }; $('#nx').onclick=function(){ ti=(ti+1)%TEXTS.length; startCheck(); }; return;
  }
  var it=z.list[z.i], an=z.picked>-1, q=it.type==='gap'?it.q.replace('___','<span class="blank'+(an?' f':'')+'">'+(an?it.right:'&nbsp;')+'</span>'):it.q;
  h+='<p class="hint">Question '+(z.i+1)+' of '+z.list.length+' | '+(it.type==='tf'?'True or false?':it.type==='mc'?'Choose':'Fill the gap')+'</p><div class="q">'+q+'</div><div class="opts'+(it.type==='tf'?' two':'')+'">'+it.o.map(function(o,k){ var cls='opt',m=''; if(an){ if(k===it.a){ cls+=' good'; m='✓ '; } else if(k===z.picked){ cls+=' bad'; m='✗ '; } } return '<button class="'+cls+'" data-k="'+k+'"'+(an?' disabled':'')+'>'+m+o+'</button>'; }).join('')+'</div>';
  if(an){ var ok=z.picked===it.a; h+='<div class="fb'+(ok?'':' no')+'"><b>'+(ok?'Correct!':'Not quite. The answer is "'+it.right+'".')+'</b>'+(it.w?'<i>'+it.w+'</i>':'')+'</div><div class="row" style="margin-top:12px"><button class="btn main" id="qn">'+(z.i===z.list.length-1?'See result':'Next')+'</button></div>'; }
  $('#view').innerHTML=h+'</div>'; bindAttr('data-ti',function(v){ ti=parseInt(v,10); startCheck(); });
  var os=document.querySelectorAll('.opt'); for(var i=0;i<os.length;i++) os[i].onclick=function(){ if(z.picked>-1) return; z.picked=parseInt(this.getAttribute('data-k'),10); if(z.picked===it.a) z.score++; else z.miss.push(it); renderCheck(); var n=$('#qn'); if(n) n.focus(); };
  if($('#qn')) $('#qn').onclick=function(){ z.i++; z.picked=-1; renderCheck(); };
}

/* ================= SPEAK ================= */
var sp={qi:0,iv:[],gi:0,gp:-1,gdone:false,ri:0};
function speakBar(){ return chips([['interview','🎙️ Interview'],['qa','💬 Talk about the text'],['retell','🔁 Retell'],['guess','🧩 Guess the place']],md.speak,'data-sm'); }
function renderSpeak(){
  var m=md.speak, h='<div class="card"><h2>Speak</h2>'+speakBar();
  if(m==='interview'){
    if(!sp.iv.length) sp.iv=shuffle(INTERVIEW); var q=sp.iv[sp.qi%sp.iv.length];
    h+='<p class="hint">Question '+((sp.qi%sp.iv.length)+1)+' of '+sp.iv.length+'. Answer with a full sentence.</p><div class="bubble">'+q+'</div>'+helpHTML('Answer with:',['Yes, I do.','No, I don\'t.','Yes, I am.','No, I am not.','I like...','I eat / drink...'])+timerHTML(20)+
     '<div class="row">'+(canSpeak?'<button class="btn" id="hear">🔊 Hear it</button>':'')+'<button class="btn amber" id="start">Start 20 sec</button><button class="btn main" id="ok">✓ Answered</button><button class="btn" id="nx">Skip</button></div><p class="hint" style="margin-top:8px">Then swap: you ask, the tutor answers. Ask a new question!</p></div>';
    $('#view').innerHTML=h; bindSm();
    if(canSpeak) $('#hear').onclick=function(){ say(q); }; $('#start').onclick=function(){ runT(20,'Time! One more sentence.'); };
    $('#ok').onclick=function(){ done('interview'); stopT(); sp.qi++; renderSpeak(); }; $('#nx').onclick=function(){ stopT(); sp.qi++; renderSpeak(); };
  } else if(m==='qa'){
    var t=TEXTS[ti], q2=t.qa[sp.qi%t.qa.length];
    h+=textBar('data-ti')+'<p class="hint">Question '+((sp.qi%t.qa.length)+1)+' of '+t.qa.length+'</p><div class="bubble">'+q2+'</div>'+helpHTML('Help (words from the text):',t.kw)+timerHTML(25)+
     '<div class="row">'+(canSpeak?'<button class="btn" id="hear">🔊 Hear it</button>':'')+'<button class="btn amber" id="start">Start 25 sec</button><button class="btn main" id="ok">✓ Answered</button><button class="btn" id="nx">Next</button></div></div>';
    $('#view').innerHTML=h; bindSm(); bindAttr('data-ti',function(v){ ti=parseInt(v,10); sp.qi=0; renderSpeak(); });
    if(canSpeak) $('#hear').onclick=function(){ say(q2); }; $('#start').onclick=function(){ runT(25,'Time! Add one more sentence.'); };
    $('#ok').onclick=function(){ done('qa'); stopT(); sp.qi++; renderSpeak(); }; $('#nx').onclick=function(){ stopT(); sp.qi++; renderSpeak(); };
  } else if(m==='retell'){
    var t3=TEXTS[ti];
    h+=textBar('data-ti')+'<div class="goal">Close your eyes or look away from the text. Tell the story with these key words. 4 to 6 sentences.</div><div class="bubble" style="text-align:center">'+t3.e+' '+t3.t+'</div>'+helpHTML('Key words:',t3.kw)+helpHTML('Start with:',t3.kind==='dlg'?['A asks...','B says...','B likes... / B doesn\'t like...']:['This is...','He / She / I am...','I see... / I eat... / I drink...','I like... / I don\'t like...'])+timerHTML(60)+
     '<div class="row"><button class="btn amber" id="start">Start 60 sec</button><button class="btn" id="peek">👀 Peek at the text</button><button class="btn main" id="ok">✓ Done</button></div></div>';
    $('#view').innerHTML=h; bindSm(); bindAttr('data-ti',function(v){ ti=parseInt(v,10); renderSpeak(); });
    $('#start').onclick=function(){ runT(60,'Time! Tell me one more detail.'); }; $('#peek').onclick=function(){ md.read='read'; setTab('read'); }; $('#ok').onclick=function(){ done('retell'); ti=(ti+1)%TEXTS.length; renderSpeak(); };
  } else {
    var g=GUESS[sp.gi%GUESS.length];
    h+='<p class="hint">Read the sentences aloud. Where am I? Choose and say: «I am in the ___.»</p><div class="plan">'+g.l.map(function(x){ return '<div class="ps"><div class="t" style="font-size:22px;font-weight:600">'+x+'</div>'+(canSpeak?'<button class="btn" data-gs="'+esc(x)+'">🔊</button>':'')+'</div>'; }).join('')+'</div><div class="opts" style="grid-template-columns:repeat(3,1fr)">'+g.o.map(function(o){ var cls='opt'+(sp.gp===o[1]?(o[1]===g.a?' good':' bad'):''); return '<button class="'+cls+'" data-go2="'+o[1]+'" style="text-align:center"><span style="font-size:40px;display:block">'+o[0]+'</span>'+o[1]+'</button>'; }).join('')+'</div>';
    if(sp.gp===g.a) h+='<div class="fb"><b>Correct!</b>Say: I am in the '+g.a+'. Then make your own sentence.</div><div class="row" style="margin-top:12px"><button class="btn main" id="ok">✓ I said it</button></div>'; else if(sp.gp!==-1) h+='<div class="fb no"><b>Not this one.</b>Read the sentences again.</div>';
    h+='</div>'; $('#view').innerHTML=h; bindSm();
    bindAttr('data-gs',function(v){ say(v); }); bindAttr('data-go2',function(v){ sp.gp=v; if(v===g.a&&canSpeak) say('I am in the '+g.a); renderSpeak(); });
    if($('#ok')) $('#ok').onclick=function(){ done('guess'); sp.gi++; sp.gp=-1; renderSpeak(); };
  }
}
function bindSm(){ bindAttr('data-sm',function(v){ stopT(); md.speak=v; sp.qi=0; sp.gp=-1; renderSpeak(); }); }

/* ================= ROLES ================= */
var rl={i:0,me:0};
function renderRoles(){
  var d=DLG[rl.i], mine=d.roles[rl.me];
  $('#view').innerHTML='<div class="card"><h2>Roles</h2>'+chips(DLG.map(function(x,i){ return [i,x.e+' '+x.t]; }),rl.i,'data-di')+'<p class="hint">You read the lines of <b>'+mine+'</b>. The tutor reads the other lines. Tap 🔊 to hear any line.</p><div class="text">'+d.l.map(function(x,i){ var me=x[0]===mine; return '<div class="ln'+(me?' said':'')+'"><span class="sp" style="min-width:60px">'+x[0]+'</span><div class="en">'+(me?'<b>'+x[1]+'</b>':x[1])+'</div>'+(canSpeak?'<button class="btn" data-rl="'+i+'" aria-label="Listen">🔊</button>':'')+'</div>'; }).join('')+'</div>'+
   '<div class="row"><button class="btn amber" id="sw">🔁 Swap roles</button><button class="btn main" id="ok">✓ We read it</button></div><div class="goal">Next step: '+d.tip+'</div>'+timerHTML(90)+'<div class="row"><button class="btn" id="start">Start 90 sec</button></div></div>';
  bindAttr('data-di',function(v){ stopT(); rl={i:parseInt(v,10),me:0}; renderRoles(); });
  bindAttr('data-rl',function(v){ say(DLG[rl.i].l[parseInt(v,10)][1]); });
  $('#sw').onclick=function(){ rl.me=(rl.me+1)%d.roles.length; renderRoles(); };
  $('#ok').onclick=function(){ done('role'); stopT(); rl={i:(rl.i+1)%DLG.length,me:0}; renderRoles(); };
  $('#start').onclick=function(){ runT(90,'Time! Now swap roles.'); };
}

upCount();
setTab('plan');
</script>
